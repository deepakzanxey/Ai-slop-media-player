
name: Build Glasswave APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o Glasswave-Build.zip -d glasswave

      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "SDK manager not found"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Add annotation dependency
        run: |
          cat >> glasswave/app/build.gradle <<'EOF'

          dependencies {
              implementation 'androidx.annotation:annotation:1.9.1'
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd glasswave && gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Glasswave-Player-APK
          path: glasswave/app/build/outputs/apk/debug/app-debug.apk
